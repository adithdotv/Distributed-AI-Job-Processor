services:

  postgres:
    image: postgres:16
    container_name: job_processor_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: job_processor
      POSTGRES_PASSWORD: adith
      POSTGRES_DB: job_processor

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    container_name: job_processor_redis
    restart: unless-stopped

    ports:
      - "6379:6379"


volumes:
  postgres_data: